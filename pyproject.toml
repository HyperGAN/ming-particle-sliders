[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ming-particle-sliders"
version = "0.1.0"
description = "Ming particle-slider product scaffold and shared formulation checks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ming-train = "ming.train:main"
ming-infer = "ming.infer:main"

[tool.setuptools]
packages = ["ming"]
py-modules = ["comfy_ming"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
